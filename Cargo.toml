[package]
name = "learn-record_web3"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=5.0.0"

[dev-dependencies]
litesvm = "=0.18.0"
solana-sdk = "=5.0.0"

[features]
default = []
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))'
] }